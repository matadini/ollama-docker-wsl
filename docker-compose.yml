services:
  ollama-nvidia:
    profiles: [nvidia]
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./.ollama_models:/root/.ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: "30m"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama-amd:
    profiles: [amd]
    image: ollama/ollama:rocm
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./.ollama_models:/root/.ollama
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/libdxcore.so
      - /opt/rocm/lib/librocdxg.so:/usr/lib/librocdxg.so
      - /opt/rocm/share/rocdxg/dids.conf:/usr/share/rocdxg/dids.conf
    devices:
      - /dev/dxg
    cap_add:
      - SYS_PTRACE
    environment:
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_DEBUG: 1
      HSA_ENABLE_DXG_DETECTION: 1
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama-init:
    image: ollama/ollama
    container_name: ollama-init
    restart: "no"
    depends_on:
      ollama-nvidia:
        condition: service_healthy
        required: false
      ollama-amd:
        condition: service_healthy
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [1/2] Pulling model ${OLLAMA_MODEL}..."
        ollama pull ${OLLAMA_MODEL}

        echo ">>> [2/2] Preloading model into memory (warmup)..."
        echo "" | ollama run ${OLLAMA_MODEL}

        echo ">>> Model is pulled and loaded. Exiting init."
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
    deploy:
      resources:
        limits:
          memory: 256M

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=False
      - HF_HUB_OFFLINE=1
    volumes:
      - ./.open-webui:/app/backend/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
